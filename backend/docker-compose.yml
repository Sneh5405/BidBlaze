version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: bidblaze-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: bidblaze
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: bidblaze-redis
    restart: always
    ports:
      - '6379:6379'

  adminer:
    image: adminer:latest
    container_name: bidblaze-adminer
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
